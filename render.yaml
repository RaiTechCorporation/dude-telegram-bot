services:
  - type: web
    name: dude-telegram-bot
    runtime: python
    region: oregon
    plan: free
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL
        value: "@dudedex"
      - key: DELAY_SECONDS
        value: "15"
